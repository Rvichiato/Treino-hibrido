<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ciclo 4 — Híbrido 12 Semanas</title>
<style>
  :root {
    --base: #3B82F6;
    --base-dim: #1D4ED8;
    --base-bg: #1e3a5f;
    --consol: #F59E0B;
    --consol-dim: #B45309;
    --consol-bg: #3d2f0a;
    --alvo: #EF4444;
    --alvo-dim: #B91C1C;
    --alvo-bg: #3d1010;
    --bg: #0f0f13;
    --card: #1a1a22;
    --card2: #222230;
    --border: #2e2e3e;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --text-muted: #555570;
    --accent: var(--base);
    --accent-bg: var(--base-bg);
    --piramide: #a78bfa;
    --biset: #34d399;
    --dropset: #fb923c;
    --metarep: #22d3ee;
    --superset: #f472b6;
    --triset: #ef4444;
    --volume: #94a3b8;
    --ativacao: #60a5fa;
    --finalizador: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .hero {
    background: linear-gradient(135deg, #0f0f18 0%, #1a1040 50%, #0f0f18 100%);
    padding: 24px 16px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -40px; left: 50%; transform: translateX(-50%);
    width: 300px; height: 200px;
    background: radial-gradient(ellipse, rgba(99,102,241,.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(99,102,241,.15);
    border: 1px solid rgba(99,102,241,.35);
    color: #a5b4fc;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .hero h1 {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .hero h1 span { color: #818cf8; }
  .hero-sub {
    margin-top: 6px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .hero-chips {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .hero-chip {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--text-dim);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* ── PHASE TABS ── */
  .phase-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: #111118;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .phase-tab {
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all .2s;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .phase-tab.active-base   { color: var(--base);   border-color: var(--base);   background: rgba(59,130,246,.06); }
  .phase-tab.active-consol { color: var(--consol); border-color: var(--consol); background: rgba(245,158,11,.06); }
  .phase-tab.active-alvo   { color: var(--alvo);   border-color: var(--alvo);   background: rgba(239,68,68,.06); }
  .phase-tab .wks { font-size: 9px; opacity: .7; margin-top: 2px; }

  /* ── WEEK STRIP ── */
  .week-strip {
    display: flex;
    overflow-x: auto;
    padding: 10px 12px;
    gap: 8px;
    background: #111118;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .week-strip::-webkit-scrollbar { display: none; }
  .week-btn {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    position: relative;
  }
  .week-btn.active-base   { border-color: var(--base);   background: var(--base-bg);   color: #fff; box-shadow: 0 0 12px rgba(59,130,246,.4); }
  .week-btn.active-consol { border-color: var(--consol); background: var(--consol-bg); color: #fff; box-shadow: 0 0 12px rgba(245,158,11,.4); }
  .week-btn.active-alvo   { border-color: var(--alvo);   background: var(--alvo-bg);   color: #fff; box-shadow: 0 0 12px rgba(239,68,68,.4); }
  .week-btn .deload-dot {
    position: absolute;
    top: -3px; right: -3px;
    width: 8px; height: 8px;
    background: #fbbf24;
    border-radius: 50%;
    border: 1px solid #0f0f13;
  }

  /* ── WORKOUT TABS ── */
  .workout-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    margin: 12px 12px 0;
    border-radius: 10px 10px 0 0;
    overflow: hidden;
  }
  .workout-tab {
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all .2s;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-muted);
  }
  .workout-tab.active { color: #fff; }
  .workout-tab.active-base   { border-color: var(--base);   background: rgba(59,130,246,.1); color: var(--base); }
  .workout-tab.active-consol { border-color: var(--consol); background: rgba(245,158,11,.1); color: var(--consol); }
  .workout-tab.active-alvo   { border-color: var(--alvo);   background: rgba(239,68,68,.1);  color: var(--alvo); }
  .workout-tab.active-run    { border-color: #34d399;        background: rgba(52,211,153,.1);  color: #34d399; }
  .workout-tab .tab-icon { font-size: 14px; display: block; margin-bottom: 2px; }

  /* ── PHASE BANNER ── */
  .phase-banner {
    margin: 0 12px;
    padding: 10px 14px;
    border-left: 4px solid;
    border-radius: 0 6px 6px 0;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255,255,255,.03);
  }
  .phase-banner.base   { border-color: var(--base);   color: var(--base); }
  .phase-banner.consol { border-color: var(--consol); color: var(--consol); }
  .phase-banner.alvo   { border-color: var(--alvo);   color: var(--alvo); }
  .phase-banner span { color: var(--text-dim); font-weight: 400; }

  /* ── WARMUP SECTION ── */
  .warmup-section {
    margin: 10px 12px;
    background: rgba(34,197,94,.06);
    border: 1px solid rgba(34,197,94,.2);
    border-radius: 10px;
    padding: 12px;
  }
  .warmup-title {
    font-size: 11px;
    font-weight: 700;
    color: #4ade80;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .warmup-items { list-style: none; }
  .warmup-items li {
    font-size: 12px;
    color: var(--text-dim);
    padding: 3px 0;
    padding-left: 12px;
    position: relative;
  }
  .warmup-items li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: #4ade80;
    font-weight: 700;
  }

  /* ── RUN CARD ── */
  .run-card {
    margin: 10px 12px 0;
    background: rgba(16,185,129,.06);
    border: 1px solid rgba(16,185,129,.2);
    border-radius: 12px;
    overflow: hidden;
  }
  .run-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: rgba(16,185,129,.08);
    border-bottom: 1px solid rgba(16,185,129,.15);
  }
  .run-day-badge {
    font-size: 10px;
    font-weight: 800;
    color: #34d399;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .run-tipo {
    font-size: 10px;
    font-weight: 700;
    color: #6ee7b7;
    background: rgba(52,211,153,.12);
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid rgba(52,211,153,.25);
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .run-seq {
    display: flex;
    align-items: stretch;
    padding: 10px 12px;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .run-seq::-webkit-scrollbar { display: none; }
  .run-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 44px;
    flex: 1;
  }
  .run-block-sep {
    display: flex;
    align-items: center;
    padding: 0 2px;
    color: var(--text-muted);
    font-size: 12px;
    padding-top: 14px;
  }
  .run-count {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 4px;
    height: 16px;
    display: flex;
    align-items: center;
  }
  .run-zone {
    font-size: 12px;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 6px;
    width: 100%;
    text-align: center;
    margin-bottom: 4px;
  }
  .run-zone.z1 { background: rgba(148,163,184,.15); color: #94a3b8; border: 1px solid rgba(148,163,184,.3); }
  .run-zone.z2 { background: rgba(96,165,250,.15);  color: #60a5fa; border: 1px solid rgba(96,165,250,.3); }
  .run-zone.z3 { background: rgba(52,211,153,.2);   color: #34d399; border: 1px solid rgba(52,211,153,.4); font-size: 14px; }
  .run-zone.z4 { background: rgba(251,146,60,.2);   color: #fb923c; border: 1px solid rgba(251,146,60,.4); }
  .run-time {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.2;
  }
  .run-descanso {
    padding: 14px 12px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .run-prova {
    padding: 12px;
    text-align: center;
  }
  .run-prova-title { font-size: 15px; font-weight: 800; color: #fb923c; margin-bottom: 4px; }
  .run-prova-sub { font-size: 11px; color: var(--text-dim); }

  /* ── EXERCISE CARDS ── */
  .exercises-container {
    padding: 8px 12px 100px;
  }
  .bloco-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .bloco-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    background: var(--card2);
    user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .bloco-num {
    width: 26px; height: 26px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    font-weight: 800;
    flex-shrink: 0;
    letter-spacing: .5px;
  }
  .bloco-num.base   { background: rgba(59,130,246,.2);  color: var(--base); }
  .bloco-num.consol { background: rgba(245,158,11,.2);  color: var(--consol); }
  .bloco-num.alvo   { background: rgba(239,68,68,.2);   color: var(--alvo); }

  .bloco-info { flex: 1; min-width: 0; }
  .bloco-exercise {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bloco-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .series-chip {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .method-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .m-piramide   { background: rgba(167,139,250,.15); color: var(--piramide);  border: 1px solid rgba(167,139,250,.3); }
  .m-biset      { background: rgba(52,211,153,.15);  color: var(--biset);     border: 1px solid rgba(52,211,153,.3); }
  .m-dropset    { background: rgba(251,146,60,.15);  color: var(--dropset);   border: 1px solid rgba(251,146,60,.3); }
  .m-metarep    { background: rgba(34,211,238,.15);  color: var(--metarep);   border: 1px solid rgba(34,211,238,.3); }
  .m-superset   { background: rgba(244,114,182,.15); color: var(--superset);  border: 1px solid rgba(244,114,182,.3); }
  .m-triset     { background: rgba(239,68,68,.15);   color: var(--triset);    border: 1px solid rgba(239,68,68,.3); }
  .m-volume     { background: rgba(148,163,184,.1);  color: var(--volume);    border: 1px solid rgba(148,163,184,.2); }
  .m-ativacao   { background: rgba(96,165,250,.12);  color: var(--ativacao);  border: 1px solid rgba(96,165,250,.25); }
  .m-finalizador{ background: rgba(251,191,36,.12);  color: var(--finalizador);border: 1px solid rgba(251,191,36,.25); }

  .expand-icon {
    color: var(--text-muted);
    font-size: 16px;
    transition: transform .2s;
    flex-shrink: 0;
  }
  .bloco-card.open .expand-icon { transform: rotate(180deg); }

  .bloco-body {
    display: none;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  .bloco-card.open .bloco-body { display: block; }
  .obs-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .obs-text {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .obs-text .warn { color: #fbbf24; }

  /* Saturday run card */
  .saturday-card {
    background: rgba(16,185,129,.07);
    border: 1px solid rgba(16,185,129,.2);
    border-radius: 12px;
    padding: 16px;
    margin: 8px 12px 100px;
    text-align: center;
  }
  .saturday-icon { font-size: 32px; margin-bottom: 8px; }
  .saturday-title { font-size: 16px; font-weight: 700; color: #34d399; }
  .saturday-detail { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .saturday-tip { font-size: 11px; color: var(--text-muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(16,185,129,.15); }

  /* ── LEGEND ── */
  .legend {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #111118;
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    z-index: 50;
  }
  .legend::-webkit-scrollbar { display: none; }
  .legend-item {
    flex: 0 0 auto;
    font-size: 9px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: .3px;
  }

  /* ── GUIDE SECTION ── */
  .guide-toggle {
    margin: 12px 12px 0;
    background: rgba(99,102,241,.08);
    border: 1px solid rgba(99,102,241,.2);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .guide-toggle-label {
    font-size: 12px;
    font-weight: 700;
    color: #a5b4fc;
    letter-spacing: .5px;
  }
  .guide-toggle-icon { color: #a5b4fc; font-size: 16px; transition: transform .2s; }
  .guide-toggle.open .guide-toggle-icon { transform: rotate(180deg); }
  .guide-content {
    margin: 0 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 12px;
    display: none;
  }
  .guide-content.open { display: block; }
  .guide-exercise {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .guide-exercise:last-child { border-bottom: none; }
  .guide-ex-name {
    font-size: 12px;
    font-weight: 700;
    color: #c4b5fd;
    margin-bottom: 4px;
  }
  .guide-ex-text {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  /* ── RUN VIEW ── */
  .run-view {
    padding: 8px 12px 100px;
  }
  .run-session-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #34d399;
    padding: 12px 0 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .run-session-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(52,211,153,.2);
  }
  .run-zones-ref {
    margin-top: 14px;
    padding: 12px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .run-zones-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .run-zones-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .run-zone-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .run-zone-pill {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 4px;
    min-width: 28px;
    text-align: center;
  }

  /* ── COMPLETION ── */
  .done-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin: 16px 0 0;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid rgba(52,211,153,.3);
    background: rgba(52,211,153,.07);
    color: #34d399;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .3px;
  }
  .done-btn:active { transform: scale(.97); }
  .done-btn.is-done {
    background: rgba(52,211,153,.18);
    border-color: #34d399;
    color: #fff;
  }
  .done-btn.is-done .done-icon { color: #34d399; }
  .done-date {
    font-size: 10px;
    font-weight: 400;
    opacity: .75;
    margin-left: 4px;
  }

  .tab-check {
    display: inline-block;
    width: 8px; height: 8px;
    background: #34d399;
    border-radius: 50%;
    margin-left: 3px;
    vertical-align: middle;
    flex-shrink: 0;
  }

  .week-progress {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-top: 3px;
  }
  .week-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
  }
  .week-dot.done { background: #34d399; }
  .week-dot.done-run { background: #34d399; }

  /* Utilities */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 8px 12px 4px;
  }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-badge">⚡ Rodrigo Vichiato</div>
  <h1>Ciclo 4 — <span>Híbrido</span> 12 Semanas</h1>
  <div class="hero-sub">Iniciado set/2026 · Metodologia BLOCO</div>
  <div class="hero-chips">
    <div class="hero-chip">🏋️ 4 dias/semana</div>
    <div class="hero-chip">🏃 3 dias corrida</div>
    <div class="hero-chip">💪 Push · Legs · Pull · Legs</div>
  </div>
</div>

<!-- PHASE TABS -->
<div class="phase-tabs">
  <div class="phase-tab active-base" onclick="setPhase('base')" id="ptab-base">
    BASE
    <div class="wks">Sem 1–4</div>
  </div>
  <div class="phase-tab" onclick="setPhase('consol')" id="ptab-consol">
    CONSOLIDAÇÃO
    <div class="wks">Sem 5–8</div>
  </div>

// ─────────────────────────────────────────
// STORAGE — completions
// ─────────────────────────────────────────
function getCompletions() {
  try { return JSON.parse(localStorage.getItem('ciclo4_completions') || '{}'); }
  catch { return {}; }
}
function saveCompletions(data) {
  try { localStorage.setItem('ciclo4_completions', JSON.stringify(data)); }
  catch {}
}
function toggleComplete(week, workout) {
  const data = getCompletions();
  const key = `${week}_${workout}`;
  if (data[key]) {
    delete data[key];
  } else {
    const now = new Date();
    data[key] = now.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
  }
  saveCompletions(data);
  renderAll();
}
function isDone(week, workout) {
  return !!getCompletions()[`${week}_${workout}`];
}
function getDoneDate(week, workout) {
  return getCompletions()[`${week}_${workout}`] || null;
}

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let currentPhase = 'base';
let currentWeek = 1;
let currentWorkout = 'A';

// ─────────────────────────────────────────
// METHOD → CSS CLASS
// ─────────────────────────────────────────
function methodClass(m) {
  const ml = m.toLowerCase();
  if (ml.includes('tri-set') || ml.includes('triset')) return 'm-triset';
  if (ml.includes('bi-set') || ml.includes('biset')) return 'm-biset';
  if (ml.includes('drop')) return 'm-dropset';
  if (ml.includes('super')) return 'm-superset';
  if (ml.includes('meta')) return 'm-metarep';
  if (ml.includes('pirâmide') || ml.includes('piramide')) return 'm-piramide';
  if (ml.includes('ativação') || ml.includes('ativacao')) return 'm-ativacao';
  if (ml.includes('finalizador')) return 'm-finalizador';
  return 'm-volume';
}

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function setPhase(phase) {
  currentPhase = phase;
  const firstWeeks = { base: 1, consol: 5, alvo: 9 };
  currentWeek = firstWeeks[phase];
  currentWorkout = 'A';
  renderAll();
}

function setWeek(w) {
  currentWeek = w;
  currentWorkout = 'A';
  renderAll();
}

function setWorkout(w) {
  currentWorkout = w;
  renderWorkout();
}

function renderAll() {
  renderPhaseTabs();
  renderWeekStrip();
  renderMain();
}

function renderPhaseTabs() {
  ['base','consol','alvo'].forEach(p => {
    const el = document.getElementById('ptab-' + p);
    el.className = 'phase-tab' + (currentPhase === p ? ' active-' + p : '');
  });
}

function renderWeekStrip() {
  const strip = document.getElementById('weekStrip');
  const ranges = { base: [1,2,3,4], consol: [5,6,7,8], alvo: [9,10,11,12] };
  const weeks = ranges[currentPhase];
  strip.innerHTML = weeks.map(w => {
    const wk = WEEKS[w];
    const isActive = w === currentWeek;
    const cls = isActive ? 'week-btn active-' + wk.phase : 'week-btn';
    const deload = wk.deload ? '<div class="deload-dot" title="Deload"></div>' : '';
    const dots = ['A','B','C','D','R'].map(k =>
      `<div class="week-dot${isDone(w,k) ? ' done' : ''}"></div>`
    ).join('');
    return `<div class="${cls}" onclick="setWeek(${w})">
      ${w}${deload}
      <div class="week-progress">${dots}</div>
    </div>`;
  }).join('');
}

function renderMain() {
  const wk = WEEKS[currentWeek];
  const phase = wk.phase;
  const phaseLabels = { base: '🔵 Etapa Base — Adaptação e Volume', consol: '🟡 Etapa Consolidação — Intensidade e Métodos Avançados', alvo: '🔴 Etapa Alvo — Pico de Performance' };
  const deloadNote = wk.deload ? ' · ⭐ DELOAD — carga −15%' : '';

  const workouts = [
    { key: 'A', icon: '💪', label: 'PUSH' },
    { key: 'B', icon: '🦵', label: 'LEGS' },
    { key: 'C', icon: '🔙', label: 'PULL' },
    { key: 'D', icon: '🍑', label: 'LEGS+' },
    { key: 'R', icon: '🏃', label: 'CORRIDA' }
  ];

  let html = `
    <div class="phase-banner ${phase}" style="margin-top:12px">
      ${phaseLabels[phase]}<span>${deloadNote}</span>
    </div>
    <div class="workout-tabs">
      ${workouts.map(w => `
        <div class="workout-tab ${currentWorkout === w.key ? 'active active-' + phase : ''}" onclick="setWorkout('${w.key}')">
          <span class="tab-icon">${w.icon}</span>${w.label}
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;
  renderWorkout();
}

function renderWorkout() {
  // Update tab active states
  const wk = WEEKS[currentWeek];
  const phase = wk.phase;
  document.querySelectorAll('.workout-tab').forEach((el, i) => {
    const keys = ['A','B','C','D','R'];
    const key = keys[i];
    const isRun = key === 'R';
    const isActive = key === currentWorkout;
    const done = isDone(currentWeek, key);
    el.className = 'workout-tab' + (isActive ? (isRun ? ' active active-run' : ' active active-' + phase) : '');
    // add/remove check dot
    const existing = el.querySelector('.tab-check');
    if (existing) existing.remove();
    if (done) {
      const dot = document.createElement('span');
      dot.className = 'tab-check';
      dot.title = 'Concluído';
      el.appendChild(dot);
    }
  });

  // ── CORRIDA TAB ──
  if (currentWorkout === 'R') {
    renderRunView(wk, phase);
    return;
  }

  const exercises = wk[currentWorkout];
  const warmupItems = WARMUPS[currentWorkout] || WARMUPS['A'];

  // No run cards inside workout tabs
  const hasRun = false;
  const runData = null;

  // Guide for this workout
  const guideData = currentWorkout === 'C' ? GUIDE.C : (currentWorkout === 'A' ? GUIDE.A : GUIDE.BD);
  const guideHTML = guideData.map(g => `
    <div class="guide-exercise">
      <div class="guide-ex-name">📌 ${g.n}</div>
      <div class="guide-ex-text">${g.t.replace('⚠', '<span class="warn">⚠</span>')}</div>
    </div>
  `).join('');

  const satNote = '';

  // Exercise cards
  const cardsHTML = exercises.map((ex, idx) => {
    const mc = methodClass(ex.m);
    const obsFormatted = ex.o.replace(/⚠/g, '<span class="warn">⚠</span>');
    return `
      <div class="bloco-card" id="card-${idx}">
        <div class="bloco-header" onclick="toggleCard(${idx})">
          <div class="bloco-num ${phase}">B${ex.b}</div>
          <div class="bloco-info">
            <div class="bloco-exercise">${ex.e}</div>
            <div class="bloco-meta">
              <span class="series-chip">${ex.s}</span>
              <span class="method-badge ${mc}">${ex.m}</span>
            </div>
          </div>
          <div class="expand-icon">▾</div>
        </div>
        <div class="bloco-body">
          <div class="obs-label">Execução</div>
          <div class="obs-text">${obsFormatted}</div>
        </div>
      </div>
    `;
  }).join('');

  // Workout label
  const workoutLabels = {
    A: 'Treino A — Peito · Ombros · Tríceps',
    B: 'Treino B — Pernas · Glúteos',
    C: 'Treino C — Costas · Bíceps',
    D: 'Treino D — Pernas · Glúteos (variação)'
  };

  const content = document.getElementById('mainContent');

  // Append below the tabs/banner
  const existing = content.querySelectorAll('.warmup-section, .run-badge, .exercises-container, .section-label, .guide-toggle, .guide-content, .saturday-card, .saturday-section');
  existing.forEach(el => el.remove());

  // Warmup
  const warmupEl = document.createElement('div');
  warmupEl.className = 'warmup-section';
  warmupEl.innerHTML = `
    <div class="warmup-title">🔥 Aquecimento — ${workoutLabels[currentWorkout]}</div>
    <ul class="warmup-items">${warmupItems.map(i=>`<li>${i}</li>`).join('')}</ul>
  `;
  content.appendChild(warmupEl);

  // (run cards moved to Corrida tab)

  // Section label
  const labelEl = document.createElement('div');
  labelEl.className = 'section-label';
  labelEl.textContent = workoutLabels[currentWorkout] + ' · Semana ' + currentWeek;
  content.appendChild(labelEl);

  // Cards
  const cardsEl = document.createElement('div');
  cardsEl.className = 'exercises-container';
  const done = isDone(currentWeek, currentWorkout);
  const doneDate = getDoneDate(currentWeek, currentWorkout);
  const workoutShort = {A:'Treino A',B:'Treino B',C:'Treino C',D:'Treino D'}[currentWorkout];
  cardsEl.innerHTML = cardsHTML + `
    <button class="done-btn${done ? ' is-done' : ''}" onclick="toggleComplete(${currentWeek}, '${currentWorkout}')">
      <span class="done-icon">${done ? '✓' : '○'}</span>
      ${done
        ? `${workoutShort} Concluído <span class="done-date">· ${doneDate}</span>`
        : `Marcar ${workoutShort} como Concluído`}
    </button>
  `;
  content.appendChild(cardsEl);

  // Guide toggle
  const guideToggle = document.createElement('div');
  guideToggle.className = 'guide-toggle';
  guideToggle.id = 'guideToggle';
  guideToggle.innerHTML = `<div class="guide-toggle-label">📖 Guia de Execução Completo</div><div class="guide-toggle-icon">▾</div>`;
  guideToggle.onclick = () => {
    guideToggle.classList.toggle('open');
    document.getElementById('guideContent').classList.toggle('open');
  };
  content.insertBefore(guideToggle, cardsEl);

  const guideCont = document.createElement('div');
  guideCont.className = 'guide-content';
  guideCont.id = 'guideContent';
  guideCont.innerHTML = guideHTML;
  content.insertBefore(guideCont, cardsEl);

}

// ─────────────────────────────────────────
// RENDER RUN VIEW
// ─────────────────────────────────────────
function renderRunView(wk, phase) {
  const content = document.getElementById('mainContent');
  const existing = content.querySelectorAll('.warmup-section, .run-badge, .exercises-container, .section-label, .guide-toggle, .guide-content, .saturday-card, .saturday-section, .run-view');
  existing.forEach(el => el.remove());

  const view = document.createElement('div');
  view.className = 'run-view';

  const phaseLabel = {base:'Base', consol:'Consolidação', alvo:'Alvo'}[phase];

  view.innerHTML = `
    <div class="run-session-label">3ª Feira — Pós Treino A</div>
    ${buildRunCard(wk.runA)}

    <div class="run-session-label">5ª Feira — Pós Treino C</div>
    ${buildRunCard(wk.runC)}

    <div class="run-session-label">${wk.runSat.prova ? 'Domingo' : 'Sábado'} — Corrida Solo</div>
    ${buildRunCard(wk.runSat)}

    <div class="run-zones-ref">
      <div class="run-zones-title">📊 Referência de Zonas — FC Máx</div>
      <div class="run-zones-grid">
        <div class="run-zone-row"><span class="run-zone-pill z1" style="background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.3)">Z1</span> 50–59% FCmáx · Recuperação</div>
        <div class="run-zone-row"><span class="run-zone-pill z2" style="background:rgba(96,165,250,.15);color:#60a5fa;border:1px solid rgba(96,165,250,.3)">Z2</span> 60–69% FCmáx · Aeróbio leve</div>
        <div class="run-zone-row"><span class="run-zone-pill z3" style="background:rgba(52,211,153,.2);color:#34d399;border:1px solid rgba(52,211,153,.4)">Z3</span> 70–79% FCmáx · Limiar moderado</div>
        <div class="run-zone-row"><span class="run-zone-pill z4" style="background:rgba(251,146,60,.2);color:#fb923c;border:1px solid rgba(251,146,60,.4)">Z4</span> 80–89% FCmáx · Anaeróbio</div>
      </div>
    </div>
  `;

  // Done button for run tab
  const runDone = isDone(currentWeek, 'R');
  const runDoneDate = getDoneDate(currentWeek, 'R');
  const runDoneHTML = `
    <button class="done-btn${runDone ? ' is-done' : ''}" onclick="toggleComplete(${currentWeek}, 'R')" style="margin:16px 0 0">
      <span class="done-icon">${runDone ? '✓' : '○'}</span>
      ${runDone
        ? `Corridas da Semana ${currentWeek} Concluídas <span class="done-date">· ${runDoneDate}</span>`
        : `Marcar Corridas da Semana ${currentWeek} como Concluídas`}
    </button>
  `;
  const doneEl = document.createElement('div');
  doneEl.innerHTML = runDoneHTML;
  view.appendChild(doneEl.firstElementChild);

  content.appendChild(view);
}

function toggleCard(idx) {
  const card = document.getElementById('card-' + idx);
  card.classList.toggle('open');
}

// ─────────────────────────────────────────
// BUILD RUN CARD
// ─────────────────────────────────────────
function buildRunCard(run) {
  if (!run) return '';

  if (run.descanso) {
    return `<div class="run-card">
      <div class="run-card-header">
        <div class="run-day-badge">😴 ${run.dia}</div>
        <div class="run-tipo">Descanso</div>
      </div>
      <div class="run-descanso">Dia de descanso — sem corrida</div>
    </div>`;
  }

  if (run.prova) {
    return `<div class="run-card" style="border-color:rgba(251,146,60,.4);background:rgba(251,146,60,.06)">
      <div class="run-card-header" style="background:rgba(251,146,60,.1);border-color:rgba(251,146,60,.2)">
        <div class="run-day-badge" style="color:#fb923c">🏆 ${run.dia}</div>
        <div class="run-tipo" style="color:#fb923c;background:rgba(251,146,60,.12);border-color:rgba(251,146,60,.3)">PROVA ALVO</div>
      </div>
      <div class="run-prova">
        <div class="run-prova-title">🏃 5 KM — Prova Alvo</div>
        <div class="run-prova-sub">Aquecimento Z1 · Prova em Z4 · Desaquecimento Z1</div>
      </div>
      ${buildSeqBlocks(run.seq)}
    </div>`;
  }

  return `<div class="run-card">
    <div class="run-card-header">
      <div class="run-day-badge">🏃 ${run.dia}</div>
      <div class="run-tipo">${run.tipo}</div>
    </div>
    ${buildSeqBlocks(run.seq)}
  </div>`;
}

function buildSeqBlocks(seq) {
  if (!seq || seq.length === 0) return '';
  let html = '<div class="run-seq">';
  seq.forEach((blk, i) => {
    const zc = blk.z.toLowerCase();
    const countLabel = blk.n > 1 ? `${blk.n}x` : '&nbsp;';
    html += `<div class="run-block">
      <div class="run-count">${countLabel}</div>
      <div class="run-zone ${zc}">${blk.z}</div>
      <div class="run-time">${blk.t}</div>
    </div>`;
    if (i < seq.length - 1) {
      html += `<div class="run-block-sep">+</div>`;
    }
  });
  html += '</div>';
  return html;
}
